<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocity — The Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: #080808;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 48px;
  gap: 20px;
}
::-webkit-scrollbar { width: 0; height: 0; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.95)} }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes ping { 0%{transform:scale(1);opacity:1} 75%,100%{transform:scale(2);opacity:0} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── DESIGN TOKENS ────────────────────────────────────────────────
const C = {
  bg:        '#0B0B0D',
  surface:   '#141416',
  card:      '#1C1C1F',
  card2:     '#242428',
  border:    '#2C2C30',
  border2:   '#383840',
  accent:    '#4F8EFF',
  accentDim: 'rgba(79,142,255,0.14)',
  accentMid: 'rgba(79,142,255,0.35)',
  green:     '#22C55E',
  greenDim:  'rgba(34,197,94,0.14)',
  red:       '#EF4444',
  redDim:    'rgba(239,68,68,0.14)',
  amber:     '#F59E0B',
  amberDim:  'rgba(245,158,11,0.14)',
  purple:    '#A78BFA',
  purpleDim: 'rgba(167,139,250,0.14)',
  text:      '#F2F2F7',
  text2:     '#8E8E96',
  text3:     '#3C3C44',
  mapBg:     '#10141E',
};

// ─── MAP SVG ──────────────────────────────────────────────────────
function MapSVG({ showRoute=false, showDriver=false, driverX=195, driverY=180, compact=false }) {
  const h = compact ? 180 : 260;
  return (
    <svg width="100%" height="100%" viewBox={`0 0 390 ${h}`} preserveAspectRatio="xMidYMid slice">
      <rect width="390" height={h} fill={C.mapBg}/>
      {/* Blocks */}
      {[[10,10,100,60],[120,10,80,60],[220,10,90,55],[320,10,60,55],[10,90,70,80],[100,90,80,80],[200,90,60,80],[280,90,100,80],[10,195,80,60],[110,195,100,60],[230,195,90,60],[340,195,40,60]].map(([x,y,w,hh],i)=>
        <rect key={i} x={x} y={y} width={w} height={hh} rx="4" fill="#161B2A" stroke="#1E2740" strokeWidth="0.5"/>
      )}
      {/* Park */}
      <rect x="180" y="90" width="95" height="80" rx="6" fill="#0D2B1A" stroke="#143D27" strokeWidth="0.5" opacity="0.8"/>
      <rect x="195" y="100" width="20" height="14" rx="3" fill="#166534" opacity="0.6"/>
      <rect x="225" y="108" width="14" height="10" rx="2" fill="#166534" opacity="0.5"/>
      <rect x="215" y="130" width="18" height="12" rx="3" fill="#166534" opacity="0.5"/>
      {/* Street network */}
      {[75,165,h-20].filter(y=>y<h).map(y=><line key={y} x1="0" y1={y} x2="390" y2={y} stroke="#1E2845" strokeWidth={y===165?7:4}/>)}
      {[90,190,300].map(x=><line key={x} x1={x} y1="0" x2={x} y2={h} stroke="#1E2845" strokeWidth={x===190?7:4}/>)}
      {/* Street labels */}
      <text x="130" y="170" fill="#253350" fontSize="8" fontFamily="Space Grotesk" fontWeight="600">MAIN STREET</text>
      <text x="195" y="50" fill="#253350" fontSize="7" fontFamily="Space Grotesk" fontWeight="600" transform="rotate(90,195,50)">OAK AVE</text>
      {/* Route path */}
      {showRoute && <>
        <path d="M 195 230 L 195 165 L 90 165 L 90 75 L 190 75" stroke={C.accent} strokeWidth="4" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M 195 230 L 195 165 L 90 165 L 90 75 L 190 75" stroke="rgba(79,142,255,0.25)" strokeWidth="12" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </>}
      {/* Destination */}
      {showRoute && <>
        <circle cx="190" cy="75" r="14" fill={C.red} opacity="0.2"/>
        <circle cx="190" cy="75" r="8" fill={C.red}/>
        <circle cx="190" cy="75" r="3" fill="white"/>
      </>}
      {/* User dot */}
      <circle cx="195" cy="230" r="18" fill={C.accent} opacity="0.1"/>
      <circle cx="195" cy="230" r="9" fill={C.accent}/>
      <circle cx="195" cy="230" r="4" fill="white"/>
      {/* Driver marker */}
      {showDriver && <>
        <circle cx={driverX} cy={driverY} r="16" fill={C.amber} opacity="0.2"/>
        <circle cx={driverX} cy={driverY} r="10" fill={C.amber}/>
        <text x={driverX} y={driverY+4} textAnchor="middle" fontSize="10">🚗</text>
      </>}
      {/* Ambient cars */}
      {[[60,80],[310,170],[150,40]].map(([x,y],i)=>
        <g key={i} opacity="0.4">
          <circle cx={x} cy={y} r="7" fill="#2A3550"/>
          <text x={x} y={y+3} textAnchor="middle" fontSize="7">🚙</text>
        </g>
      )}
    </svg>
  );
}

// ─── SHARED UI ATOMS ──────────────────────────────────────────────
function StatusBar({ light=false }) {
  const [time, setTime] = useState('');
  useEffect(()=>{
    const fmt=()=>{const n=new Date();return n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});};
    setTime(fmt());
    const id=setInterval(()=>setTime(fmt()),10000);
    return()=>clearInterval(id);
  },[]);
  const col = light ? '#000' : C.text;
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 22px 6px',color:col,flexShrink:0}}>
      <span style={{fontSize:14,fontWeight:700}}>{time||'09:41'}</span>
      <div style={{display:'flex',gap:5,alignItems:'center'}}>
        {/* Signal */}
        <svg width="14" height="10" viewBox="0 0 14 10"><rect x="0" y="6" width="2.5" height="4" rx="0.5" fill={col}/><rect x="3.5" y="4" width="2.5" height="6" rx="0.5" fill={col}/><rect x="7" y="2" width="2.5" height="8" rx="0.5" fill={col}/><rect x="10.5" y="0" width="2.5" height="10" rx="0.5" fill={col}/></svg>
        {/* WiFi */}
        <svg width="14" height="10" viewBox="0 0 18 13"><path d="M9 12a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" fill={col}/><path d="M4.5 8.5C5.8 7.2 7.3 6.5 9 6.5s3.2.7 4.5 2" stroke={col} strokeWidth="1.5" fill="none" strokeLinecap="round"/><path d="M1.5 5.5C3.5 3.5 6.1 2.5 9 2.5s5.5 1 7.5 3" stroke={col} strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>
        {/* Battery */}
        <svg width="22" height="11" viewBox="0 0 22 11"><rect x="0" y="1" width="19" height="9" rx="2" stroke={col} strokeWidth="1.5" fill="none"/><rect x="1.5" y="2.5" width="14" height="6" rx="1" fill={col}/><rect x="19.5" y="3.5" width="2" height="4" rx="1" fill={col} opacity="0.6"/></svg>
      </div>
    </div>
  );
}

function HomeIndicator({ dark=false }) {
  return <div style={{width:134,height:5,background:dark?'rgba(0,0,0,0.25)':'rgba(255,255,255,0.22)',borderRadius:3,margin:'6px auto 10px',flexShrink:0}}/>;
}

function TopBar({ title, onBack, right, transparent=false }) {
  return (
    <div style={{display:'flex',alignItems:'center',padding:'6px 16px 10px',gap:10,flexShrink:0}}>
      {onBack && (
        <button onClick={onBack} style={{width:34,height:34,borderRadius:10,background:C.card2,border:`1px solid ${C.border}`,color:C.text,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
        </button>
      )}
      <span style={{fontSize:19,fontWeight:700,flex:1,color:C.text,letterSpacing:'-0.3px'}}>{title}</span>
      {right}
    </div>
  );
}

function Card({ children, style={}, onClick, glow }) {
  const [hov, setHov] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        background: hov && onClick ? C.card2 : C.card,
        borderRadius:16, padding:'14px 16px',
        border:`1px solid ${glow ? C.accent : C.border}`,
        boxShadow: glow ? `0 0 20px ${C.accentMid}` : 'none',
        cursor: onClick ? 'pointer' : 'default',
        transition:'all 0.18s',
        animation:'slideUp 0.25s ease',
        ...style
      }}
    >{children}</div>
  );
}

function Badge({ color='blue', children, dot=false }) {
  const map = { blue:[C.accent,C.accentDim], green:[C.green,C.greenDim], red:[C.red,C.redDim], amber:[C.amber,C.amberDim], purple:[C.purple,C.purpleDim] };
  const [fg,bg] = map[color]||map.blue;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:5,background:bg,color:fg,fontSize:10,fontWeight:700,padding:'3px 9px',borderRadius:20,border:`1px solid ${fg}22`,letterSpacing:'0.3px',textTransform:'uppercase'}}>
      {dot && <span style={{width:5,height:5,borderRadius:'50%',background:fg,display:'inline-block'}}/>}
      {children}
    </span>
  );
}

function Avatar({ name, size=40, color=C.accent }) {
  const initials = name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  return (
    <div style={{width:size,height:size,borderRadius:'50%',background:`linear-gradient(135deg, ${color}, ${color}99)`,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:size*0.33,flexShrink:0,border:`2px solid ${color}33`}}>
      {initials}
    </div>
  );
}

function Stars({ rating, small=false }) {
  return (
    <span style={{color:C.amber,fontSize:small?11:13,display:'inline-flex',alignItems:'center',gap:2}}>
      {Array.from({length:5},(_,i)=><span key={i} style={{opacity:i<Math.floor(rating)?1:0.3}}>★</span>)}
      <span style={{color:C.text2,fontWeight:600,fontSize:small?10:12,marginLeft:2}}>{rating}</span>
    </span>
  );
}

function Toggle({ on, onChange, color=C.green }) {
  return (
    <div onClick={onChange} style={{width:52,height:28,background:on?color:'#2C2C30',borderRadius:14,position:'relative',cursor:'pointer',transition:'background 0.3s',border:`1px solid ${on?color:C.border}`,flexShrink:0}}>
      <div style={{position:'absolute',top:3,left:on?26:3,width:20,height:20,background:'white',borderRadius:'50%',transition:'left 0.25s cubic-bezier(.4,0,.2,1)',boxShadow:'0 2px 6px rgba(0,0,0,0.4)'}}/>
    </div>
  );
}

function Divider() { return <div style={{height:1,background:C.border,margin:'4px 0'}}/>; }

// ─── BOTTOM NAV ───────────────────────────────────────────────────
function BottomNav({ tabs, active, onChange, accentColor=C.accent }) {
  return (
    <div style={{display:'flex',background:C.surface,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
      {tabs.map(t=>{
        const isActive = active===t.id;
        return (
          <button key={t.id} onClick={()=>onChange(t.id)} style={{flex:1,background:'none',border:'none',color:isActive?accentColor:C.text2,padding:'9px 0 6px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,transition:'color 0.2s'}}>
            <span style={{fontSize:20,lineHeight:1}}>{t.icon}</span>
            <span style={{fontSize:9,fontWeight:700,letterSpacing:'0.4px',textTransform:'uppercase'}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// USER / RIDER ROLE
// ═══════════════════════════════════════════════════════════════════
const userNavTabs = [
  {id:'home',label:'Home',icon:'🏠'},
  {id:'history',label:'Trips',icon:'📋'},
  {id:'profile',label:'Profile',icon:'👤'},
];

function UserApp() {
  const [screen, setScreen] = useState('home');
  const [tab, setTab] = useState('home');
  const goto = useCallback((s)=>{ setScreen(s); if(['home','history','profile'].includes(s)) setTab(s); },[]);
  const showNav = !['search','tracking'].includes(screen);
  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:C.bg,overflow:'hidden'}}>
      <StatusBar/>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {screen==='home'     && <UserHome goto={goto}/>}
        {screen==='search'   && <UserSearch goto={goto}/>}
        {screen==='tracking' && <UserTracking goto={goto}/>}
        {screen==='history'  && <UserHistory goto={goto}/>}
        {screen==='profile'  && <UserProfile goto={goto}/>}
      </div>
      {showNav && <BottomNav tabs={userNavTabs} active={tab} onChange={goto}/>}
      <HomeIndicator/>
    </div>
  );
}

function UserHome({ goto }) {
  return (
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
      {/* Map with overlay header */}
      <div style={{height:260,position:'relative',flexShrink:0}}>
        <MapSVG/>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom, rgba(11,11,13,0.85) 0%, transparent 55%, rgba(11,11,13,0.7) 100%)'}}/>
        <div style={{position:'absolute',top:0,left:0,right:0,padding:'10px 18px',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.55)',fontWeight:500}}>Good morning</div>
            <div style={{fontSize:21,fontWeight:700,color:'white',letterSpacing:'-0.4px'}}>Alex Johnson 👋</div>
          </div>
          <div style={{width:42,height:42,borderRadius:12,overflow:'hidden',border:'2px solid rgba(255,255,255,0.15)',flexShrink:0}}>
            <img src="velocity-logo.jfif" alt="V" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
          </div>
        </div>
        {/* Search bar on map */}
        <button onClick={()=>goto('search')} style={{position:'absolute',bottom:14,left:14,right:14,background:'rgba(20,20,22,0.95)',backdropFilter:'blur(12px)',border:`1px solid ${C.border2}`,borderRadius:14,padding:'13px 16px',color:C.text2,textAlign:'left',cursor:'pointer',display:'flex',alignItems:'center',gap:10,fontSize:14,fontFamily:'Space Grotesk'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2.5" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Where are you going?
          <span style={{marginLeft:'auto',fontSize:11,color:C.accent,fontWeight:600}}>→</span>
        </button>
      </div>

      {/* Content */}
      <div style={{flex:1,padding:'16px',display:'flex',flexDirection:'column',gap:14}}>
        {/* Quick destinations */}
        <div style={{display:'flex',gap:10}}>
          {[{icon:'🏠',label:'Home',addr:'123 Oak Street'},{icon:'💼',label:'Work',addr:'Tech Hub, Downtown'}].map(p=>(
            <button key={p.label} onClick={()=>goto('search')} style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:'12px',cursor:'pointer',textAlign:'left',fontFamily:'Space Grotesk',transition:'border-color 0.2s'}}>
              <div style={{fontSize:22,marginBottom:5}}>{p.icon}</div>
              <div style={{fontSize:13,fontWeight:700,color:C.text}}>{p.label}</div>
              <div style={{fontSize:11,color:C.text2,marginTop:1}}>{p.addr}</div>
            </button>
          ))}
          <button onClick={()=>goto('search')} style={{width:60,background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:'12px 8px',cursor:'pointer',textAlign:'center',fontFamily:'Space Grotesk',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4}}>
            <span style={{fontSize:22}}>➕</span>
            <span style={{fontSize:10,color:C.text2,fontWeight:600}}>New</span>
          </button>
        </div>

        {/* Recent */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontSize:14,fontWeight:700,color:C.text}}>Recent places</span>
          <span style={{fontSize:12,color:C.accent,fontWeight:600,cursor:'pointer'}}>See all</span>
        </div>
        {[
          {icon:'🛍️',place:'Downtown Mall',dist:'2.4 km',time:'Yesterday'},
          {icon:'✈️',place:'Airport Terminal 1',dist:'18.2 km',time:'Mon'},
          {icon:'🏥',place:'City Hospital',dist:'5.7 km',time:'Sun'},
        ].map(r=>(
          <button key={r.place} onClick={()=>goto('search')} style={{display:'flex',alignItems:'center',gap:12,background:'none',border:'none',padding:'2px 0',cursor:'pointer',width:'100%',fontFamily:'Space Grotesk'}}>
            <div style={{width:40,height:40,borderRadius:11,background:C.card2,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}>{r.icon}</div>
            <div style={{flex:1,textAlign:'left'}}>
              <div style={{fontSize:14,fontWeight:600,color:C.text}}>{r.place}</div>
              <div style={{fontSize:12,color:C.text2}}>{r.dist} • {r.time}</div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.text3} strokeWidth="2" strokeLinecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        ))}

        {/* Promo */}
        <div style={{background:`linear-gradient(135deg, ${C.accentDim}, ${C.purpleDim})`,border:`1px solid ${C.accentMid}`,borderRadius:16,padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:30}}>🎁</span>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>First ride 20% off</div>
            <div style={{fontSize:12,color:C.text2}}>Use code VELOCITY20 at checkout</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function UserSearch({ goto }) {
  const [sel, setSel] = useState(null);
  const rides = [
    {id:'economy', name:'Economy',     desc:'Affordable everyday rides', price:'$8.50',  eta:'4 min',  icon:'🚗', seats:4},
    {id:'comfort', name:'Comfort',     desc:'Extra legroom & comfort',    price:'$13.20', eta:'6 min',  icon:'🚙', seats:4},
    {id:'premium', name:'Premium',     desc:'Luxury vehicles',            price:'$22.00', eta:'8 min',  icon:'🏎️', seats:4},
    {id:'xl',      name:'XL',          desc:'For groups up to 6',         price:'$18.50', eta:'10 min', icon:'🚐', seats:6},
  ];
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <TopBar title="Book a Ride" onBack={()=>goto('home')}/>
      {/* Location inputs */}
      <div style={{padding:'0 16px 12px',flexShrink:0}}>
        <div style={{background:C.card,borderRadius:16,overflow:'hidden',border:`1px solid ${C.border}`}}>
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'11px 14px',borderBottom:`1px solid ${C.border}`}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:C.green,flexShrink:0,boxShadow:`0 0 8px ${C.green}`}}/>
            <div>
              <div style={{fontSize:10,color:C.text2,fontWeight:600,letterSpacing:'0.5px',textTransform:'uppercase'}}>Pickup</div>
              <div style={{fontSize:14,fontWeight:600,color:C.text}}>Current Location</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'11px 14px'}}>
            <div style={{width:10,height:10,borderRadius:3,background:C.red,flexShrink:0}}/>
            <div>
              <div style={{fontSize:10,color:C.text2,fontWeight:600,letterSpacing:'0.5px',textTransform:'uppercase'}}>Drop-off</div>
              <div style={{fontSize:14,fontWeight:600,color:C.text}}>Downtown Mall</div>
            </div>
          </div>
        </div>
        {/* Mini map */}
        <div style={{height:110,borderRadius:14,overflow:'hidden',border:`1px solid ${C.border}`,marginTop:10}}>
          <MapSVG showRoute compact/>
        </div>
        {/* Distance info */}
        <div style={{display:'flex',gap:16,padding:'8px 4px',fontSize:12,color:C.text2}}>
          <span>📍 2.4 km</span>
          <span>⏱ ~12 min</span>
          <span>🛣️ Via Oak Avenue</span>
        </div>
      </div>
      {/* Ride options */}
      <div style={{flex:1,overflowY:'auto',padding:'0 16px',display:'flex',flexDirection:'column',gap:8}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text2,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:2}}>Choose a ride</div>
        {rides.map(r=>{
          const isSelected = sel===r.id;
          return (

                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.text2} strokeWidth="2" strokeLinecap="round"><path d="m9 18 6-6-6-6"/></svg>
                </Card>
              ))}
            </div>
          </div>
        ))}
        <div style={{height:8}}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// ROLE SWITCHER + ROOT
// ═══════════════════════════════════════════════════════════════════
function RoleSwitcher({ role, onChange }) {
  const roles = [
    {id:'user',   label:'Rider',  emoji:'👤', color:C.accent},
    {id:'driver', label:'Driver', emoji:'🚗', color:C.green},
    {id:'admin',  label:'Admin',  emoji:'⚡', color:C.amber},
  ];
  return (
    <div style={{display:'flex',gap:0,background:'#111115',borderRadius:18,padding:5,border:`1px solid ${C.border}`,boxShadow:'0 4px 24px rgba(0,0,0,0.5)'}}>
      {roles.map(r=>{
        const active = role===r.id;
        return (
          <button key={r.id} onClick={()=>onChange(r.id)} style={{flex:1,background:active?r.color:'transparent',border:'none',borderRadius:13,padding:'11px 14px',cursor:'pointer',transition:'all 0.22s cubic-bezier(.4,0,.2,1)',color:active?'#000':'#6B6B70',fontFamily:'Space Grotesk',fontWeight:700,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',gap:7,boxShadow:active?`0 4px 20px ${r.color}55`:'none'}}>
            <span style={{fontSize:16}}>{r.emoji}</span>{r.label}
          </button>
        );
      })}
    </div>
  );
}
